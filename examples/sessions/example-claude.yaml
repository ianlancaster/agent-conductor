# A Claude Code session. Place at .conductor/config/sessions/<codename>.yaml — files here hot-reload.
codename: alpha
repo: ../my-project # absolute, or relative to the conductor directory
runtime: claude-code # default
# bypassPermissions: false # optional override of defaults.bypassPermissions
# allowSelfAuto: true # optional override of defaults.allowSelfAuto; lets this session
# call toggle_auto on itself. Takes effect on the next config reload — no restart.
model: claude-opus-4-8 # optional; falls back to runtimes.claudeCode.defaultModel, then the CLI default
# effort: xhigh # optional; falls back to runtimes.claudeCode.defaultEffort, then the CLI default
additionalDirs:
  - ../shared-notes
schedules:
  - label: morning-standup
    cron: '0 9 * * 1-5'
    prompt: Review overnight CI results and summarize anything broken.
    paused: false # disable this one schedule without pausing the whole session
  - label: nightly-fresh
    cron: '0 2 * * *'
    prompt: Start the nightly maintenance checklist.
    freshContext: true # stop + restart with a clean context before delivering
