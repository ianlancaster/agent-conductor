# The stall sentinel is a normal session designated by sentinel.codename in supervisor.yaml.
# Give it the shipped sentinel instructions via systemPromptFile so it knows how to
# judge each stall message and respond with ordinary session tools. Copy
# prompts/sentinel.md from the agent-conductor package into .conductor/prompts/ first.
# The file is capped at 5 KiB UTF-8, privately snapshotted on start/continue,
# and retained across Claude Code and Codex compaction.
codename: watch
repo: ../watch
runtime: claude-code
systemPromptFile: ./.conductor/prompts/sentinel.md
