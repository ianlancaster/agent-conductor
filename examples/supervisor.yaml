# agent-conductor supervisor config — every value shown is the default; omit what you don't change.
# Place at <your fleet dir>/.conductor/config/supervisor.yaml

supervisor:
  heartbeatIntervalSeconds: 30
  logLevel: info

paths:
  dataDir: ./.conductor/data

# Inert local knowledge bundles. Built-in runbooks and .conductor/runbooks are
# discovered automatically; list only additional local checkouts here.
runbooks:
  paths: []

# Local, content-free durable event history for plugins and evaluation. The
# journal grows append-only in the fleet database; export or archive it as needed.
events:
  journal:
    enabled: true

terminal:
  # backend: iterm | tmux. Default auto-detects: tmux when the conductor is started
  # inside tmux ($TMUX set), otherwise iterm on macOS and tmux elsewhere. Daemons
  # (launchd/systemd) have no $TMUX — set the backend explicitly for daemon fleets.
  # backend: iterm
  # windowName: My Fleet          # default: "Agent Conductor (<fleet dir name>)"
  iterm:
    badge: true # watermark the session codename on the pane; set false to disable
    bracketedPasteThreshold: 512
    launchTimeoutSec: 8
    pollIntervalSec: 0.25
  tmux:
    # When the conductor is started from inside tmux, session panes join YOUR
    # tmux window (splits / new windows in the session you launched from), just
    # like the iTerm backend. Set false to always use the detached session below.
    attachToCurrent: true
    # Show each pane's title ("codename — tag") in a border line above it.
    # tmux hides pane titles by default, which makes a fleet unidentifiable.
    # Set false to leave your window's border style untouched.
    paneBorders: true
    # sessionName: my-fleet       # detached-mode session name; default: conductor-<fleet slug>, unique per fleet dir

# The initial stall sentinel: a session (configured like any other in
# .conductor/config/sessions/) that receives ALL stalls from auto sessions and decides
# what to do. The set_sentinel MCP tool can change or clear it at runtime; that
# choice persists in the fleet database and overrides this initial value.
# Launch it with .conductor/prompts/sentinel.md as its instructions. Leave unset until you
# have defined that session — a dangling codename only earns you a startup warning.
# sentinel:
#   codename: watch

defaults:
  auto: false
  runtime: claude-code # built-ins: claude-code | codex; embedding hosts may register more
  # Bypass runtime approval prompts and sandbox restrictions. Session files can override.
  bypassPermissions: true
  placement: pane # pane | tab | window

mcp:
  # port: 3456                    # default: derived per fleet dir (3456–3955), stable across restarts
  host: 127.0.0.1
  keepAliveTimeoutMs: 60000

health:
  captureLines: 40
  idleConfirmMs: 15000 # quiet period after a Stop event before it becomes an idle stall
  fleetStallConfirmMs: 300000 # after every member of a fleet watch stalls; default 5 minutes
  stallBeatsThreshold: 2 # fallback watchdog: unchanged heartbeats before a silent stall
  suppressWindowMs: 300000
  suppressSimilarity: 0.8
  eventSilenceMs: 120000 # wait this long without lifecycle events before pane-diff fallback begins

messaging:
  queueDrainMs: 2000 # how often held messages retry; also the release latency after input clears
  # Safety valve for a conductor delivery stuck unsubmitted in a composer.
  # Applies ONLY to the conductor's own drafts — text the OPERATOR is typing
  # (any unsigned input) is never typed over, no matter how old the queue is;
  # messages wait behind it and release when the input clears.
  queueMaxAgeMs: 60000
  tailDefaultLines: 30
  tailMaxLines: 500

runtimes:
  claudeCode:
    binary: claude
    # defaultModel: claude-opus-4-8
    # Discovery hints shown on spawn_session.model. Replace freely; they are not a validator.
    availableModels:
      - claude-fable-5
      - claude-opus-4-8
      - claude-sonnet-5
      - claude-haiku-4-5-20251001
    # defaultEffort: xhigh # fleet launch default; omit to let Claude Code choose
    # Hints shown on spawn/start/continue effort. Model support varies; unknown values still pass through.
    availableEfforts: [low, medium, high, xhigh, max]
    autocompactPct: 70
    disableNonessentialTraffic: true # exports CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1; disable if it breaks tools you rely on
    bareUi: true # bare-bones panes: no spinner tips, prompt suggestions, or onboarding/startup hints. Set false for the full Claude Code UI.
    # Native auto-memory is disabled by default. Set this override to "0" to re-enable it.
    env: {} # e.g. { CLAUDE_CODE_DISABLE_AUTO_MEMORY: "0" }; values override built-in conductor defaults
  codex:
    binary: codex
    # defaultModel: gpt-5.6
    # Account/provider availability varies; custom-provider model IDs are allowed too.
    availableModels:
      - gpt-5.6
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5.6-luna
      - gpt-5.4
      - gpt-5.3-codex-spark
    # defaultEffort: xhigh # fleet launch default; omit to let Codex choose
    # Hints only; providers/models may support a subset or additional levels.
    availableEfforts: [none, minimal, low, medium, high, xhigh, max, ultra]
    toolTimeoutSec: 600 # Codex default is 60s — too low for long conductor tools
    bareUi: true # bare-bones panes: no startup update prompt (it BLOCKS spawned panes), analytics, tips, animations, or terminal-title writes. Set false for stock Codex behavior.
    # Conductor writes a compact-only SessionStart hook that restores its protocol after Codex compaction.
    # Non-managed hooks require review through /hooks. For unattended fleets only, this trusts EVERY hook
    # Codex discovers from the shared config, repository, and plugins; enable only after vetting all sources.
    bypassHookTrust: false

channels:
  telegram:
    enabled: false # opt in; credentials come from .conductor/.env or the inherited environment
  slack:
    enabled: false # opt in; credentials come from .conductor/.env or the inherited environment

# Optional PR Shepherd companion. conductor start creates its inert profile beside this file.
# Configure and shadow-test that profile before enabling, then restart Conductor deliberately.
shepherd:
  enabled: false
  configPath: null # null uses config/pr-shepherd.yaml; relative paths resolve beside this file
  presentation: headless # headless | panel (panel currently reports unsupported)

spawn:
  # Where /spawn and spawn_session create a session's working directory,
  # resolved relative to the fleet dir; {codename} is substituted.
  #   './{codename}'  → inside the fleet dir (default)
  #   '../{codename}' → sibling of the fleet dir (keeps the fleet dir config-only)
  # Worktree spawns use this destination too unless path/--path is supplied.
  # New branches start at the source repository's current HEAD; no fetch is performed.
  dirPattern: './{codename}'
  markerFile: .agent-marker # presence marks a repo as an agent project (🤖) in status
  # Git-backed workspace templates selectable with /spawn --template or spawn_session.template.
  # Sources may be HTTPS/SSH URLs, scp-style Git sources, absolute paths, or paths relative to the fleet dir.
  # Conductor clones without running repository scripts and names the source remote "template".
  templates:
    agent:
      source: https://github.com/ianlancaster/cognitive-agent-template
      # ref: main # optional branch, tag, or commit
  templateCloneTimeoutSeconds: 120
