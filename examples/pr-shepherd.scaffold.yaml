# Generated by conductor start. Replace CHANGE_ME, then remove the identity-required marker line.
# agent-conductor-pr-shepherd-scaffold: identity-required
version: 2
profile:
  githubUser: CHANGE_ME
polling:
  intervalSeconds: 180
  bootstrap: baseline-only
github:
  defaultRepo: null
  includeOwners: []
  includeRepos: []
  excludeOwners: []
  excludeRepos: []
  mode: direct
  mergeMethod: squash
checks: { required: [], ignored: [] }
reviews: { ignoredActors: [], ignoredCommentPatterns: [], requiredApprovals: 1, bots: [] }
features:
  authoredPRs: { enabled: true }
  trackedPRs:
    enabled: false
    releaseGate: none
    selectors: []
  reviewInbox: { enabled: false, ignoreDrafts: true, ignoredRepos: [], maxAgeDays: 5 }
  reviewFollowUp: { enabled: false }
  reviewerNudge: { enabled: false, escalateAfterHours: 24, businessDaysOnly: true, timezone: UTC, maxEscalations: 1 }
  staleThresholdHours: 4
automation: { autoMerge: notify, branchUpdate: notify, reviewerComment: notify }
delivery: { type: stdout }
guidance: {}
# Resolved relative to this profile: .conductor/config/../data on new fleets, config/../data on legacy fleets.
databasePath: ../data/pr-shepherd-v2.db
